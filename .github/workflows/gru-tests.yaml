name: GRU CPU regression tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  gru-cpu:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LKT_REQUIRE_TORCH_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::torch
          needs: check
      - name: Install CPU runtime
        shell: Rscript {0}
        run: |
          torch::install_torch(type = 'cpu')
      - name: Install LKT
        run: R CMD INSTALL .
      - name: Require and run neural regression tests
        run: |
          Rscript tests/gru-defaults.R
          Rscript tests/gru-configuration.R
          Rscript tests/gru-features.R
          Rscript tests/gru-regression.R
          Rscript tests/gru-inference.R
          Rscript tests/gru-runtime.R
          Rscript tests/gru-encoders.R
          Rscript tests/gru-time-features.R
          Rscript tests/gru-retrieval.R
          Rscript tests/gru-retrieval-filter.R
          Rscript tests/gru-ktst-ideas.R
          Rscript tests/gru-input-fusion.R
          Rscript tests/gru-joint-encoder.R
          Rscript tests/gru-all-layer-inputs.R
          Rscript tests/gru-initialization.R
          Rscript tests/sequence-mamba.R
          Rscript tests/sequence-configuration.R
          Rscript tests/sequence-runtime.R
          Rscript tests/sequence-unit-contract.R
          python3 scripts/test-sequence-launcher.py
