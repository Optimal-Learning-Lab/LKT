name: GRU CPU regression tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  gru-cpu:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LKT_REQUIRE_TORCH_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::torch
          needs: check
      - name: Install CPU runtime
        shell: Rscript {0}
        run: |
          torch::install_torch(type = 'cpu')
      - name: Install LKT
        run: R CMD INSTALL .
      - name: Require and run neural regression tests
        run: |
          failed=()
          for test in \
            tests/gru-defaults.R \
            tests/gru-configuration.R \
            tests/gru-features.R \
            tests/gru-regression.R \
            tests/gru-inference.R \
            tests/gru-runtime.R \
            tests/gru-encoders.R \
            tests/gru-time-features.R \
            tests/gru-retrieval.R \
            tests/gru-retrieval-filter.R \
            tests/gru-ktst-ideas.R \
            tests/gru-input-fusion.R \
            tests/gru-joint-encoder.R \
            tests/gru-all-layer-inputs.R \
            tests/gru-initialization.R \
            tests/sequence-mamba.R \
            tests/sequence-configuration.R \
            tests/sequence-runtime.R \
            tests/sequence-unit-contract.R \
          ; do
            echo "::group::$test"
            if ! Rscript "$test"; then failed+=("$test"); fi
            echo "::endgroup::"
          done
          if ! python3 scripts/test-sequence-launcher.py; then
            failed+=("scripts/test-sequence-launcher.py")
          fi
          if ((${#failed[@]})); then
            printf 'Failed regression scripts: %s\n' "${failed[*]}" >&2
            exit 1
          fi
